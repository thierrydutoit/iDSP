<!DOCTYPE html>
<!-- iDSP upsampling revised: anti-imaging naming, corrected FFT scaling, fixed 0-64 kHz spectrum -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Upsampling</title>

  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Source+Code+Pro:wght@400;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --text: rgb(49, 51, 63);
      --muted: rgb(90, 93, 108);
      --accent: rgb(255, 75, 75);
      --track: rgba(49, 51, 63, 0.18);
      --code-bg: rgba(49, 51, 63, 0.06);
      --border: rgba(49, 51, 63, 0.18);
      --thumb-size: 1rem;
    }

    * { box-sizing: border-box; }

    body {
      font-family: "Source Sans 3", "Source Sans Pro", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      max-width: 46rem;
      margin: 0 auto;
      padding: 2rem 1rem 3rem 1rem;
      line-height: 1.5;
      font-size: 1rem;
      background: white;
    }

    h1 {
      margin: 0 0 0.75rem 0;
      font-weight: 700;
      font-size: 2.2rem;
      line-height: 1.2;
      letter-spacing: -0.01em;
    }

    p {
      margin: 0 0 1rem 0;
      font-size: 1.05rem;
    }

    code {
      font-family: "Source Code Pro", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      background: var(--code-bg);
      padding: 0.08rem 0.32rem;
      border-radius: 0.35rem;
      font-size: 0.92em;
    }

    .controls-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin: 1rem 0 1.1rem 0;
      align-items: start;
    }

    .control { min-width: 0; }

    .labelrow {
      display: flex;
      justify-content: flex-start;
      align-items: baseline;
      gap: 0.75rem;
      margin-bottom: 0.18rem;
      min-height: 1.2rem;
    }

    .labelrow label {
      font-weight: 600;
      font-size: 1rem;
      margin: 0;
    }

    .slider-wrap {
      position: relative;
      padding-top: 0.68rem;
      padding-bottom: 0.42rem;
    }

    .slider-value-bubble {
      position: absolute;
      top: -0.02rem;
      left: var(--pct);
      transform: translateX(-50%);
      color: var(--text);
      font-weight: 600;
      font-size: 0.84rem;
      line-height: 1;
      white-space: nowrap;
      pointer-events: none;
    }

    .slider-limits {
      position: absolute;
      left: 0;
      right: 0;
      bottom: -0.02rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--muted);
      font-size: 0.74rem;
      line-height: 1;
      pointer-events: none;
    }

    input[type="range"] {
      width: 100%;
      margin: 0;
      background: transparent;
      appearance: none;
      -webkit-appearance: none;
      --pct: 50%;
    }

    input[type="range"]:focus { outline: none; }

    input[type="range"]::-webkit-slider-runnable-track {
      height: 0.34rem;
      border-radius: 999px;
      background: linear-gradient(to right,
        var(--accent) 0%,
        var(--accent) var(--pct),
        var(--track) var(--pct),
        var(--track) 100%);
    }

    input[type="range"]::-moz-range-track {
      height: 0.34rem;
      border-radius: 999px;
      background: var(--track);
    }

    input[type="range"]::-moz-range-progress {
      height: 0.34rem;
      border-radius: 999px;
      background: var(--accent);
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: var(--thumb-size);
      height: var(--thumb-size);
      border-radius: 50%;
      background: white;
      border: 2px solid var(--accent);
      box-shadow: 0 1px 2px rgba(0,0,0,0.15);
      margin-top: -5px;
      cursor: pointer;
    }

    input[type="range"]::-moz-range-thumb {
      width: var(--thumb-size);
      height: var(--thumb-size);
      border-radius: 50%;
      background: white;
      border: 2px solid var(--accent);
      box-shadow: 0 1px 2px rgba(0,0,0,0.15);
      cursor: pointer;
    }

    .checkbox-card { padding-top: 0.1rem; }

    .checkbox-wrap {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      min-height: 2.3rem;
      padding: 0.42rem 0;
    }

    .checkbox-wrap input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      width: 1.05rem;
      height: 1.05rem;
      border: 1.5px solid rgba(49, 51, 63, 0.35);
      border-radius: 0.28rem;
      background: white;
      display: inline-grid;
      place-content: center;
      cursor: pointer;
      margin: 0;
    }

    .checkbox-wrap input[type="checkbox"]::before {
      content: "";
      width: 0.58rem;
      height: 0.58rem;
      transform: scale(0);
      transition: 120ms transform ease-in-out;
      box-shadow: inset 1rem 1rem white;
      clip-path: polygon(14% 44%, 0 59%, 50% 100%, 100% 16%, 84% 0, 43% 62%);
    }

    .checkbox-wrap input[type="checkbox"]:checked {
      background: var(--accent);
      border-color: var(--accent);
    }

    .checkbox-wrap input[type="checkbox"]:checked::before { transform: scale(1); }

    .checkbox-wrap label {
      font-weight: 600;
      cursor: pointer;
      margin: 0;
    }

    .plot {
      width: 100%;
      margin: 0.5rem 0 1rem 0;
    }

    #timePlot, #freqPlot { height: 300px; }

    details {
      margin-top: 1.35rem;
      padding: 0;
      border: none;
      background: transparent;
    }

    summary {
      cursor: pointer;
      font-weight: 600;
      margin-bottom: 0.75rem;
    }

    .errorbox {
      display: none;
      margin: 1rem 0;
      padding: 0.8rem 1rem;
      border-radius: 0.5rem;
      background: rgba(255, 75, 75, 0.08);
      color: rgb(120, 20, 20);
      font-size: 0.95rem;
    }

    ul {
      margin-top: 0.3rem;
      padding-left: 1.25rem;
    }

    @media (max-width: 700px) {
      .controls-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <h1>⬆️ Upsampling</h1>
  <p>
    Why do we need to low-pass a discrete signal after upsampling it?
    Try it by yourself.
  </p>

  <div id="errorbox" class="errorbox"></div>

  <div class="controls-row">
    <div class="control">
      <div class="labelrow">
        <label for="factor">Upsampling factor ×</label>
      </div>
      <div class="slider-wrap">
        <div class="slider-value-bubble" id="factorVal">2</div>
        <input id="factor" type="range" min="1" max="4" step="1" value="1" />
        <div class="slider-limits">
          <span>1</span>
          <span>4</span>
        </div>
      </div>
    </div>

    <div class="control checkbox-card">
      <div class="labelrow">
        <label for="applyFilter">Anti-imaging filter</label>
      </div>
      <div class="checkbox-wrap">
        <input id="applyFilter" type="checkbox" unchecked />
        <label for="applyFilter">Enable</label>
      </div>
    </div>
  </div>

  <div id="timePlot" class="plot"></div>
  <div id="freqPlot" class="plot"></div>

  <audio id="audioOriginal" preload="auto" style="display:none"></audio>
  <audio id="audioUpsampled" preload="auto" style="display:none"></audio>

  <details>
    <summary>Open for comments</summary>
    <div id="notes"></div>
  </details>

  <script>
    const fs = 2000;
    const f0 = 150;
    const duty = 60;
    const duration = 0.5;

    const els = {
      factor: document.getElementById("factor"),
      factorVal: document.getElementById("factorVal"),
      applyFilter: document.getElementById("applyFilter"),
      audioOriginal: document.getElementById("audioOriginal"),
      audioUpsampled: document.getElementById("audioUpsampled"),
      notes: document.getElementById("notes"),
      errorbox: document.getElementById("errorbox")
    };

    function showError(msg) {
      els.errorbox.style.display = "block";
      els.errorbox.textContent = msg;
    }

    function clearError() {
      els.errorbox.style.display = "none";
      els.errorbox.textContent = "";
    }

    function setSliderUI(el, bubbleEl) {
      const min = Number(el.min ?? 0);
      const max = Number(el.max ?? 100);
      const val = Number(el.value);
      const pct = ((val - min) * 100) / (max - min);
      el.style.setProperty("--pct", `${pct}%`);
      bubbleEl.style.left = `${pct}%`;
    }

    function commonPlotLayout(title) {
      return {
        title,
        font: {
          family: '"Source Sans 3","Source Sans Pro",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif',
          size: 14,
          color: "rgb(49, 51, 63)"
        },
        margin: { t: 42, l: 46, r: 12, b: 42 },
        paper_bgcolor: "white",
        plot_bgcolor: "white",
        showlegend: true
      };
    }

    function linspaceCount(n, fn) {
      const out = new Float64Array(n);
      for (let i = 0; i < n; i++) out[i] = fn(i);
      return out;
    }

    function squareWave(t, freq, dutyCycle) {
      const T = 1 / freq;
      const phase = ((t % T) + T) % T;
      return phase < (dutyCycle / 100) * T ? 1 : -1;
    }

    function sinc(x) {
      if (Math.abs(x) < 1e-12) return 1;
      return Math.sin(Math.PI * x) / (Math.PI * x);
    }

    function makeInterpolationFIR(factor, halfSymbols = 8) {
      const half = Math.max(1, halfSymbols * factor);
      const taps = 2 * half + 1;
      const h = new Float64Array(taps);

      for (let i = 0; i < taps; i++) {
        const m = i - half;
        const ideal = sinc(m / factor);
        const win = 0.54 + 0.46 * Math.cos(Math.PI * m / half);
        h[i] = ideal * win;
      }

      return { h, half };
    }

    function centeredConvolve(x, h, half) {
      const y = new Float64Array(x.length);
      for (let n = 0; n < x.length; n++) {
        let sum = 0;
        const k0 = Math.max(0, n - half);
        const k1 = Math.min(x.length - 1, n + half);
        for (let k = k0; k <= k1; k++) {
          const hIndex = half + n - k;
          sum += x[k] * h[hIndex];
        }
        y[n] = sum;
      }
      return y;
    }

    function hann(N) {
      const w = new Float64Array(N);
      if (N === 1) {
        w[0] = 1;
        return w;
      }
      for (let n = 0; n < N; n++) {
        w[n] = 0.5 - 0.5 * Math.cos((2 * Math.PI * n) / (N - 1));
      }
      return w;
    }

    function nextPow2(n) {
      let p = 1;
      while (p < n) p *= 2;
      return p;
    }

    function fftInPlace(re, im) {
      const n = re.length;

      for (let i = 1, j = 0; i < n; i++) {
        let bit = n >> 1;
        for (; j & bit; bit >>= 1) j ^= bit;
        j ^= bit;
        if (i < j) {
          let tmp = re[i]; re[i] = re[j]; re[j] = tmp;
          tmp = im[i]; im[i] = im[j]; im[j] = tmp;
        }
      }

      for (let len = 2; len <= n; len <<= 1) {
        const ang = -2 * Math.PI / len;
        const wlenRe = Math.cos(ang);
        const wlenIm = Math.sin(ang);

        for (let i = 0; i < n; i += len) {
          let wRe = 1;
          let wIm = 0;
          const half = len >> 1;

          for (let j = 0; j < half; j++) {
            const uRe = re[i + j];
            const uIm = im[i + j];
            const vRe0 = re[i + j + half];
            const vIm0 = im[i + j + half];
            const vRe = vRe0 * wRe - vIm0 * wIm;
            const vIm = vRe0 * wIm + vIm0 * wRe;

            re[i + j] = uRe + vRe;
            im[i + j] = uIm + vIm;
            re[i + j + half] = uRe - vRe;
            im[i + j + half] = uIm - vIm;

            const nextWRe = wRe * wlenRe - wIm * wlenIm;
            wIm = wRe * wlenIm + wIm * wlenRe;
            wRe = nextWRe;
          }
        }
      }
    }

    function rfftMag(x, fsLocal, scaleComp = 1) {
      const Nwin = x.length;
      if (Nwin < 4) return { f: [0], db: [-120] };

      const w = hann(Nwin);
      let cg = 0;
      for (let i = 0; i < Nwin; i++) cg += w[i];
      cg /= Nwin;

      const Nfft = nextPow2(Nwin);
      const re = new Float64Array(Nfft);
      const im = new Float64Array(Nfft);

      for (let i = 0; i < Nwin; i++) re[i] = x[i] * w[i];
      fftInPlace(re, im);

      const K = Math.floor(Nfft / 2) + 1;
      const freqs = new Array(K);
      const mags = new Array(K);

      for (let k = 0; k < K; k++) {
        const mag = scaleComp * (2 / Nwin) * Math.hypot(re[k], im[k]) / Math.max(cg, 1e-12);
        mags[k] = 20 * Math.log10(Math.max(mag, 1e-12));
        freqs[k] = k * fsLocal / Nfft;
      }

      return { f: freqs, db: mags };
    }

    // Build the periodic replicas of a real-valued discrete-time spectrum
    // beyond its Nyquist frequency. The principal interval [0, fs/2] stays
    // opaque; these returned points are used only for the faded replicas.
    function periodicSpectrumImages(spec, fsSignal, maxFreq) {
      const nyquist = fsSignal / 2;
      if (maxFreq <= nyquist || spec.f.length < 2) {
        return { f: [], db: [] };
      }

      const df = spec.f[1] - spec.f[0];
      const imageF = [];
      const imageDb = [];

      function interpBase(foldedFreq) {
        const pos = foldedFreq / df;
        const i0 = Math.max(0, Math.min(spec.db.length - 1, Math.floor(pos)));
        const i1 = Math.max(0, Math.min(spec.db.length - 1, i0 + 1));
        const frac = Math.max(0, Math.min(1, pos - i0));
        return spec.db[i0] * (1 - frac) + spec.db[i1] * frac;
      }

      // Start exactly at Nyquist so the faded replica joins the principal
      // spectrum without a visual gap.
      for (let f = nyquist; f <= maxFreq + 0.5 * df; f += df) {
        const wrapped = ((f % fsSignal) + fsSignal) % fsSignal;
        const folded = Math.min(wrapped, fsSignal - wrapped);
        imageF.push(f);
        imageDb.push(interpBase(folded));
      }

      return { f: imageF, db: imageDb };
    }

    function makeWavBlobUrl(samples, sampleRate) {
      const x = new Float32Array(samples.length);
      let peak = 0;
      for (let i = 0; i < samples.length; i++) peak = Math.max(peak, Math.abs(samples[i]));
      const gain = 0.9 / Math.max(peak, 1);

      for (let i = 0; i < samples.length; i++) {
        x[i] = Math.max(-1, Math.min(1, gain * samples[i]));
      }

      const numChannels = 1;
      const bitsPerSample = 16;
      const blockAlign = numChannels * bitsPerSample / 8;
      const byteRate = sampleRate * blockAlign;
      const dataSize = x.length * 2;
      const buffer = new ArrayBuffer(44 + dataSize);
      const view = new DataView(buffer);

      function writeString(offset, s) {
        for (let i = 0; i < s.length; i++) view.setUint8(offset + i, s.charCodeAt(i));
      }

      writeString(0, "RIFF");
      view.setUint32(4, 36 + dataSize, true);
      writeString(8, "WAVE");
      writeString(12, "fmt ");
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, numChannels, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, byteRate, true);
      view.setUint16(32, blockAlign, true);
      view.setUint16(34, bitsPerSample, true);
      writeString(36, "data");
      view.setUint32(40, dataSize, true);

      let offset = 44;
      for (let i = 0; i < x.length; i++, offset += 2) {
        const s = x[i];
        view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7fff, true);
      }

      const blob = new Blob([buffer], { type: "audio/wav" });
      return URL.createObjectURL(blob);
    }

    let prevOriginalUrl = null;
    let prevUpsampledUrl = null;

    function updateApp(playUpsampled = false) {
      try {
        clearError();

        const factor = Math.max(1, Number(els.factor.value) || 1);
        const applyFilter = els.applyFilter.checked;
        els.factorVal.textContent = String(factor);
        setSliderUI(els.factor, els.factorVal);

        const N = Math.round(duration * fs);
        const t = linspaceCount(N, i => i / fs);
        const sig = new Float64Array(N);
        for (let i = 0; i < N; i++) sig[i] = squareWave(t[i], f0, duty);

        const fsUs = fs * factor;
        const sigZero = new Float64Array(N * factor);
        for (let i = 0; i < N; i++) sigZero[i * factor] = sig[i];

        let sigUs = sigZero;
        if (applyFilter && factor > 1) {
          const { h, half } = makeInterpolationFIR(factor, 8);
          sigUs = centeredConvolve(sigZero, h, half);
        }

        const tUs = new Float64Array(sigUs.length);
        for (let i = 0; i < sigUs.length; i++) tUs[i] = i / fsUs;

        const showTime = 0.02;
        const showOriginal = Math.min(N, Math.round(showTime * fs));
        const showUs = Math.min(sigUs.length, Math.round(showTime * fsUs));

        const timeTraces = [
          {
            x: Array.from(t.slice(0, showOriginal)),
            y: Array.from(sig.slice(0, showOriginal)),
            type: "scatter",
            mode: "lines+markers",
            marker: { size: 4 },
            line: { width: 2 },
            name: "Original",
            opacity: 0.9
          }
        ];

        if (factor > 1 && applyFilter) {
          timeTraces.push({
            x: Array.from(tUs.slice(0, showUs)),
            y: Array.from(sigZero.slice(0, showUs)),
            type: "scatter",
            mode: "lines+markers",
            marker: { size: 4, color: "orange" },
            line: { width: 1.5, color: "orange" },
            name: `Upsampled ×${factor}`,
            opacity: 0.5
          });
          timeTraces.push({
            x: Array.from(tUs.slice(0, showUs)),
            y: Array.from(sigUs.slice(0, showUs)),
            type: "scatter",
            mode: "lines",
            line: { width: 2, color: "green" },
            name: "Filtered (post-upsampling)",
            opacity: 0.9
          });
        } else if (factor > 1) {
          timeTraces.push({
            x: Array.from(tUs.slice(0, showUs)),
            y: Array.from(sigUs.slice(0, showUs)),
            type: "scatter",
            mode: "lines+markers",
            marker: { size: 4, color: "orange" },
            line: { width: 1.5, color: "orange" },
            name: `Upsampled ×${factor}`,
            opacity: 0.8
          });
        }

        Plotly.react("timePlot", timeTraces, {
          ...commonPlotLayout("Time Domain"),
          legend: {
            x: 0.02,
            y: 0.98,
            xanchor: "left",
            yanchor: "top",
            bgcolor: "rgba(255,255,255,0.75)",
            bordercolor: "rgba(0,0,0,0)"
          },
          xaxis: {
            title: { text: "Time [s]", font: { size: 11 } },
            tickfont: { size: 10 },
            showline: false,
            zeroline: false
          },
          yaxis: {
            title: { text: "Amplitude", font: { size: 11 } },
            tickfont: { size: 10 },
            range: [-1.35, 1.35],
            showline: false,
            zeroline: false
          }
        }, { responsive: true });

        const NwinOriginal = Math.min(2048, sig.length);
        const NwinUs = Math.min(NwinOriginal * factor, sigUs.length);
        const specOriginal = rfftMag(sig.slice(0, NwinOriginal), fs);
        const specZero = rfftMag(sigZero.slice(0, NwinUs), fsUs, factor);
        const specUsScale = (!applyFilter && factor > 1) ? factor : 1;
        const specUs = rfftMag(sigUs.slice(0, NwinUs), fsUs, specUsScale);

        const freqMax = 8000;
        const originalColor = "#636EFA";
        const upsampledColor = "orange";
        const filteredColor = "green";

        const freqTraces = [];

        function addSpectrumWithPeriodicImages(spec, fsSignal, name, color, opacity = 0.9) {
          freqTraces.push({
            x: spec.f,
            y: spec.db,
            type: "scatter",
            mode: "lines",
            line: { width: 2, color },
            name,
            opacity
          });

          const images = periodicSpectrumImages(spec, fsSignal, freqMax);
          if (images.f.length > 0) {
            freqTraces.push({
              x: images.f,
              y: images.db,
              type: "scatter",
              mode: "lines",
              line: { width: 2, color },
              name: `${name} — periodic images`,
              opacity: 0.28,
              showlegend: false,
              hovertemplate: "%{x:.0f} Hz<br>%{y:.1f} dB<extra>periodic image</extra>"
            });
          }
        }

        // Every discrete-time spectrum is periodic. Keep the principal
        // 0-to-Nyquist interval opaque, then show its replicas more faintly.
        addSpectrumWithPeriodicImages(
          specOriginal,
          fs,
          "Original (dB)",
          originalColor,
          0.9
        );

        if (factor > 1 && applyFilter) {
          addSpectrumWithPeriodicImages(
            specZero,
            fsUs,
            `Upsampled ×${factor} (images)`,
            upsampledColor,
            0.75
          );

          addSpectrumWithPeriodicImages(
            specUs,
            fsUs,
            `Filtered ×${factor} (dB)`,
            filteredColor,
            0.9
          );
        } else if (factor > 1) {
          addSpectrumWithPeriodicImages(
            specUs,
            fsUs,
            `Upsampled ×${factor} (images)`,
            upsampledColor,
            0.75
          );
        }

        Plotly.react("freqPlot", freqTraces, {
          ...commonPlotLayout("Frequency Domain"),
          legend: {
            x: 0.98,
            y: 0.98,
            xanchor: "right",
            yanchor: "top",
            bgcolor: "rgba(255,255,255,0.75)",
            bordercolor: "rgba(0,0,0,0)"
          },
          xaxis: {
            title: { text: "Frequency [Hz]", font: { size: 11 } },
            tickfont: { size: 10 },
            range: [0, freqMax],
            showline: false,
            zeroline: false,
            gridcolor: "rgba(49, 51, 63, 0.10)"
          },
          yaxis: {
            title: { text: "Magnitude [dB]", font: { size: 11 } },
            tickfont: { size: 10 },
            range: [-80, 5],
            showline: false,
            zeroline: false,
            gridcolor: "rgba(49, 51, 63, 0.10)"
          }
        }, { responsive: true });

        if (prevOriginalUrl) URL.revokeObjectURL(prevOriginalUrl);
        if (prevUpsampledUrl) URL.revokeObjectURL(prevUpsampledUrl);
        prevOriginalUrl = makeWavBlobUrl(sig, fs);
        prevUpsampledUrl = makeWavBlobUrl(sigUs, fsUs);

        els.audioOriginal.src = prevOriginalUrl;
        els.audioUpsampled.src = prevUpsampledUrl;

        if (playUpsampled) {
          els.audioUpsampled.pause();
          els.audioUpsampled.currentTime = 0;
          els.audioUpsampled.play().catch(() => {});
        }

        const nyOriginal = fs / 2;
        const nyNew = fsUs / 2;
        const inserted = Math.max(factor - 1, 0);

        els.notes.innerHTML = `
          <p><strong>Sampling</strong></p>
          <ul>
            <li>Original fs: <strong>${fs} Hz</strong> (Nyquist: <strong>${nyOriginal.toFixed(0)} Hz</strong>)</li>
            <li>Upsampled fs: <strong>${fsUs} Hz</strong> (Nyquist: <strong>${nyNew.toFixed(0)} Hz</strong>)</li>
          </ul>
          <p><strong>What to observe</strong></p>
          <ul>
            <li>Upsampling by <strong>${factor}</strong> inserts <strong>${inserted}</strong> zero(s) between consecutive original samples.</li>
            <li>Zero insertion does <strong>not</strong> create new information. It only produces increases the Nyquist frequency, thereby incorporating <strong>spectral images</strong> inside the hearable signal.</li>
            <li>The faded curves beyond each signal's Nyquist frequency are the <strong>periodic replicas of that digital signal's spectrum</strong>.</li>
            <li>With the <strong>anti-imaging filter OFF</strong>, those images remain above the original Nyquist frequency (<strong>${nyOriginal.toFixed(0)} Hz</strong>), and the intermediate samples are zero.</li>
            <li>With the <strong>anti-imaging filter ON</strong>, the low-pass filter keeps the original baseband and suppresses the images while reconstructing intermediate sample values.</li>
            <li>Every <strong>${factor}th</strong> output sample coincides with an original sample.</li>
          </ul>
          <p>
            Unlike downsampling, upsampling does not create aliasing by itself. Its characteristic artifact is <strong>imaging</strong>; the anti-imaging filter removes those images.
          </p>
          <p>
            In digital signal processing, the resulting upsampling+anti-imaging processing block is called <strong>interpolation</strong>.
          </p>
        `;
      } catch (err) {
        showError("Error: " + err.message);
      }
    }

    function init() {
      try {
        setSliderUI(els.factor, els.factorVal);
        els.factor.addEventListener("input", function () {
          updateApp(true);
        });
        els.applyFilter.addEventListener("change", function () {
          updateApp(true);
        });
        updateApp();
      } catch (err) {
        showError("Error: " + err.message);
      }
    }

    window.addEventListener("DOMContentLoaded", init);
  </script>
</body>
</html>
